<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>On Paper</title>
  <!-- Liquid-glass opt-in. MUST run before the stylesheets below so the
       <html>/<body> background is transparent from the first paint — otherwise
       the opaque theme background flashes for a frame before the JS bundle
       loads, hiding the macOS vibrancy. Tauri injects its runtime globals at
       document-start, so this classic (non-module) script can detect the shell
       synchronously here. `?translucent` forces it on in a plain browser for
       CSS previewing; the hidden `?print=1` PDF-capture window is excluded so
       the captured resume keeps a solid background.

       SECURITY: the desktop CSP allowlists this inline script by its SHA-256 hash
       (not 'unsafe-inline'); if you change the script below, recompute the hash and
       update script-src in src-tauri/tauri.conf.json — see TAURI.md "Content Security
       Policy". -->
  <script>
    (function () {
      try {
        var params = new URLSearchParams(window.location.search);
        if (params.has('print')) return; // PDF-capture window stays opaque
        var inTauri =
          'isTauri' in window ||
          '__TAURI_INTERNALS__' in window ||
          '__TAURI__' in window;
        // iOS has no NSVisualEffectView vibrancy layer behind the webview, so
        // clearing to transparent there leaves a bare black UIView. Only the
        // desktop targets (macOS/Windows/Linux) get the glass treatment.
        // iPadOS serves a DESKTOP-class user agent — measured on an iPad Pro
        // (iOS 27): "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)…" with
        // navigator.platform "MacIntel". A UA test alone therefore MISSES iPad,
        // re-enabling the glass treatment and turning the app transparent over a
        // bare black UIView. The touch-point check is the discriminator: iPadOS
        // reports maxTouchPoints 5, a real Mac reports 0.
        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if ((inTauri && !isIOS) || params.has('translucent')) {
          document.documentElement.setAttribute('data-tauri', 'true');
        }
      } catch (_) {
        /* never block boot on detection */
      }
    })();
  </script>
  <!-- Resume-document fonts (incl. the default Cormorant Garamond + DM Sans
       pairing) load DYNAMICALLY via fontService.initFontService() — never
       statically here — so a system-font pairing makes zero Google Fonts
       requests (the README's privacy section promises this). Chrome UI fonts
       (Geist) are bundled via @fontsource. -->
  <link rel="stylesheet" href="/styles/main.css">
  <link rel="stylesheet" href="/styles/resume.css">
  <link rel="stylesheet" href="/styles/editor.css">
  <link rel="stylesheet" href="/styles/chat.css">
  <link rel="stylesheet" href="/styles/onboarding.css">
  <!-- print.css contains BOTH @media print rules (gated to print preview by the
       @media wrapper itself) AND html.pdf-export-mode class rules (applied when
       src/pdf.js toggles the class on <html> before native PDF capture). The
       file must be loaded WITHOUT media="print" so the class-based rules can
       fire during WKWebView's createPDF, which does not trigger print mode. -->
  <link rel="stylesheet" href="/styles/print.css">
  <!-- Liquid-glass / vibrancy overrides. Loaded LAST and fully gated behind
       :root[data-tauri="true"], so it is inert in a plain browser and only
       turns the chrome translucent inside the Tauri desktop shell. -->
  <link rel="stylesheet" href="/styles/glass.css">
  <!-- Native iOS shell overrides. Loaded LAST and fully gated behind
       html.op-native-shell, a class only src/iosShell.js adds and only when the
       SwiftUI chrome (src-tauri/ios/OPShell.swift) says it is installed. Inert
       on desktop, in the browser, and in the print/PDF window. -->
  <link rel="stylesheet" href="/styles/native-shell.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
