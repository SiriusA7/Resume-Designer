[package]
name = "resume-designer"
version = "1.0.0"
description = "A private career workspace for resumes and job applications."
authors = ["Ash Shah"]
license = "CC-BY-NC-SA-4.0"
edition = "2021"
rust-version = "1.77"

[lib]
# NB: `package.name` above stays `resume-designer` on purpose — with no
# `bundle.mainBinaryName` set it becomes CFBundleExecutable / the installed
# Windows .exe name, and renaming it would add a second moving part to the
# Windows upgrade path. Only the lib name is branded.
name = "on_paper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# `macos-private-api` is REQUIRED for `transparent: true` to take effect on
# macOS (it's gated behind this Cargo feature AND `app.macOSPrivateApi` in
# tauri.conf.json — both are needed, and neither warns if missing). It unlocks
# the NSVisualEffect vibrancy used by `windowEffects` for the glassy look.
[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "rt"] }
thiserror = "1"
# base64 streams the preview PDF's bytes to the renderer (read_pdf_preview).
base64 = "0.22"
# Used by the one-time legacy-Electron migrator (commands/migration.rs).
# Pure-Rust LevelDB reader so we don't drag in a C++ build toolchain across
# all three target platforms. The `fs` feature is REQUIRED, not optional:
# without it, rusty-leveldb's default Options::env is an in-memory env
# rather than `PosixDiskEnv`, so DB::open silently can't see any real
# files (CURRENT, MANIFEST, .ldb) and fails with "database does not exist"
# even when the directory is right there. `dirs` resolves $HOME / $APPDATA /
# $XDG_CONFIG_HOME for Electron userData path lookup.
rusty-leveldb = "3"
dirs = "5"
# Loopback HTTP listener for the companion-extension bridge (commands/bridge.rs).
# Requests are forwarded to the webview as events; JS answers via bridge_respond.
tiny_http = "0.12"
# OS credential store for the OpenRouter API key (commands/secret.rs), so the
# key is encrypted at rest instead of sitting in plaintext under app_data_dir.
# The two native features are the only ones enabled: `apple-native` is the
# macOS Security framework, `windows-native` is wincred, and each is cfg-gated
# inside the crate so naming both is correct for our two shipping targets.
# No Linux feature on purpose — this app ships macOS + Windows, and pulling in
# secret-service would drag D-Bus into the tree for a platform we don't build.
#
# Held at 3.x deliberately: keyring 4.x requires rustc 1.88 and this crate pins
# `rust-version = "1.77"`, so cargo declines the upgrade rather than silently
# raising our toolchain floor. Revisit together with that pin, not before.
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }

[dev-dependencies]
# Isolated temp dirs for the storage-command filesystem tests. Already in the
# dependency tree transitively (Cargo.lock pins 3.27), so this adds nothing.
tempfile = "3"

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
# Compare the beta and stable manifest versions for the beta channel's
# superset update check (commands/updater.rs).
semver = "1"

# Shared by every Apple target: the WKWebView.createPDF export
# (commands/pdf_apple.rs) and, on iOS, the view-hierarchy workaround in
# src/ios_view.rs plus the native shell installer in src/ios_shell.rs.
#
# One block for both, because createPDF is one API: `WKPDFConfiguration` is not
# cfg-gated in objc2-web-kit and the selector exists on both platforms. Only
# the `WKWebView` *binding* is macOS-only (0.3.2 ships no iOS class at all),
# which pdf_apple.rs handles with a raw msg_send on iOS rather than another dep.
# The old split gave iOS a cut-down set on the assumption that objc2-web-kit
# needs AppKit; it does not — it needs it only for the macOS class.
#
# Versions pinned to match what Tauri 2.11 / wry 0.55 pull in transitively, so
# the dep tree contains a single copy of each crate. See `cargo tree -d` to
# verify there are no duplicates.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSError", "NSString", "NSGeometry"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKPDFConfiguration", "block2"] }
block2 = "0.6"
# keyring 3.6.3 cannot set kSecAttrSynchronizable, so Apple secret storage
# uses PasswordOptions directly while other targets keep keyring.
security-framework = "3.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS only: WKWebView is an NSView there, so its bindings need AppKit. Cargo
# unions features across target blocks, so this adds to the Apple block above.
objc2-web-kit = { version = "0.3", features = ["objc2-app-kit"] }


[target.'cfg(target_os = "windows")'.dependencies]
# windows 0.61 matches the transitive version webview2-com 0.38 pulls in;
# pinning here keeps Interface/cast/HSTRING types from the SAME crate version
# so type-resolution works for WebView2's COM cast chain.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com"] }

# Pure-Rust PDF writer shared by every native PDF export: merge the per-sheet
# WebView captures into one multi-page PDF (commands/pdf_merge.rs). macOS and
# iOS scale each WKWebView page from CSS px to physical size; Windows
# concatenates per-sheet WebView2 prints that are already physically sized.
[target.'cfg(any(target_os = "macos", target_os = "ios", target_os = "windows"))'.dependencies]
lopdf = "0.36"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
